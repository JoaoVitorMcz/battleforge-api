services:
  postgres:
    image: postgres:16-alpine
    container_name: battleforge-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-battleforge}
      POSTGRES_USER: ${POSTGRES_USER:-battleforge}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-battleforge}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - battleforge-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-battleforge} -d ${POSTGRES_DB:-battleforge}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

volumes:
  battleforge-pgdata:
